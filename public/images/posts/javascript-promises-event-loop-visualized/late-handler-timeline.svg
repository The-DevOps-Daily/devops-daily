<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">A handler attached too late</title>
  <desc id="d">Two promises start at 0 ms. The user promise resolves at 300 ms. The invoices promise rejects at 50 ms. The function is still awaiting user, so nothing handles the invoices rejection yet, and Node.js exits with code 1 at 50 ms. The await on invoices that would have handled it is never reached. Promise.all attaches a handler to both promises at once, so the error is caught.</desc>
  <rect width="960" height="600" rx="20" fill="#fafafa"/>
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'DejaVu Sans', sans-serif">
    <text x="30" y="58" font-size="40" font-weight="700" fill="#09090b">Handled later is not handled</text>

    <!-- axis: x = 200 + ms * 2.4 -->
    <g font-size="24" fill="#71717a" text-anchor="middle">
      <path d="M200 126H920" stroke="#d4d4d8" stroke-width="2.5"/>
      <path d="M200 118V134M320 118V134M440 118V134M680 118V134M920 118V134" stroke="#a1a1aa" stroke-width="2.5"/>
      <text x="200" y="106">0 ms</text>
      <text x="320" y="106">50</text>
      <text x="440" y="106">100</text>
      <text x="680" y="106">200</text>
      <text x="920" y="106" text-anchor="end">300</text>
    </g>

    <!-- crash line, under the bars -->
    <path d="M320 138V352" stroke="#dc2626" stroke-width="4"/>

    <!-- lanes -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="26" fill="#09090b">
      <text x="30" y="183">user</text>
      <text x="30" y="253">invoices</text>
      <text x="30" y="323">function</text>
    </g>
    <rect x="200" y="158" width="120" height="36" rx="7" fill="#a1a1aa"/>
    <rect x="322" y="158" width="598" height="36" rx="7" fill="none" stroke="#a1a1aa" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="906" y="185" font-size="24" fill="#71717a" text-anchor="end">would resolve here</text>

    <rect x="200" y="228" width="120" height="36" rx="7" fill="#dc2626"/>
    <text x="338" y="256" font-size="26" font-weight="700" fill="#b91c1c">rejects at 50 ms</text>

    <rect x="200" y="298" width="120" height="36" rx="7" fill="#fde68a"/>
    <rect x="322" y="298" width="598" height="36" rx="7" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="906" y="325" font-size="24" fill="#92400e" text-anchor="end">await invoices: never reached</text>

    <!-- result -->
    <rect x="30" y="376" width="900" height="88" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="52" y="416" font-size="28" font-weight="700" fill="#b91c1c">At 50 ms nothing handles the error.</text>
    <text x="52" y="450" font-size="26" fill="#3f3f46">The function still waits on user. Node.js exits with code 1.</text>

    <rect x="30" y="482" width="900" height="92" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="52" y="522" font-size="28" font-weight="700" fill="#15803d">Fix: <tspan font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="26" fill="#09090b">await Promise.all([user, invoices])</tspan></text>
    <text x="52" y="558" font-size="26" fill="#3f3f46">It handles both promises from the start.</text>
  </g>
</svg>
