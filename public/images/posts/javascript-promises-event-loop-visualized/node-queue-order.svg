<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">What runs next in Node.js</title>
  <desc id="d">In Node.js the current callback runs to the end. Then the process.nextTick queue drains, then the promise microtask queue drains, and this repeats until both are empty. Only then does the next callback run. A nextTick never interrupts a microtask drain that is already running. Measured on Node 24.22.3: in a CommonJS file the top-level nextTick runs before the promise callback; in an ES module, whose top level runs inside a microtask drain, the promise callback runs first.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="600" rx="20" fill="#fafafa"/>
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'DejaVu Sans', sans-serif">
    <text x="30" y="58" font-size="40" font-weight="700" fill="#09090b">What runs next in Node.js</text>

    <!-- ladder -->
    <g font-size="28" font-weight="700">
      <rect x="30" y="88" width="460" height="76" rx="14" fill="#ffffff" stroke="#a1a1aa" stroke-width="2"/>
      <circle cx="70" cy="126" r="20" fill="#18181b"/>
      <text x="70" y="135" font-size="22" text-anchor="middle" fill="#ffffff">1</text>
      <text x="104" y="136" fill="#09090b">The current callback</text>

      <rect x="30" y="196" width="460" height="76" rx="14" fill="#ffffff" stroke="#18181b" stroke-width="2.5"/>
      <circle cx="70" cy="234" r="20" fill="#18181b"/>
      <text x="70" y="243" font-size="22" text-anchor="middle" fill="#ffffff">2</text>
      <text x="104" y="244" font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="26" fill="#09090b">nextTick queue</text>

      <rect x="30" y="304" width="460" height="76" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
      <circle cx="70" cy="342" r="20" fill="#d97706"/>
      <text x="70" y="351" font-size="22" text-anchor="middle" fill="#09090b">3</text>
      <text x="104" y="352" fill="#b45309">Promise microtasks</text>

      <rect x="30" y="412" width="460" height="76" rx="14" fill="#ffffff" stroke="#a1a1aa" stroke-width="2"/>
      <circle cx="70" cy="450" r="20" fill="#18181b"/>
      <text x="70" y="459" font-size="22" text-anchor="middle" fill="#ffffff">4</text>
      <text x="104" y="460" fill="#09090b">The next callback</text>
    </g>
    <path d="M260 166V192" stroke="#71717a" stroke-width="3" marker-end="url(#ah)"/>
    <path d="M260 274V300" stroke="#71717a" stroke-width="3" marker-end="url(#ah)"/>
    <path d="M260 382V408" stroke="#71717a" stroke-width="3" marker-end="url(#ah)"/>
    <path d="M492 342H528V234H498" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#ah)"/>
    <text x="540" y="282" font-size="24" fill="#92400e">until</text>
    <text x="540" y="310" font-size="24" fill="#92400e">both</text>
    <text x="540" y="338" font-size="24" fill="#92400e">empty</text>

    <!-- CJS vs ESM -->
    <text x="640" y="114" font-size="26" font-weight="700" fill="#52525b">Top-level code</text>
    <rect x="640" y="132" width="290" height="170" rx="14" fill="#18181b"/>
    <text x="660" y="172" font-size="26" font-weight="700" fill="#f4f4f5">CommonJS</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24">
      <text x="660" y="220" fill="#f4f4f5" font-weight="700">nextTick</text>
      <text x="660" y="260" fill="#fbbf24">promise then</text>
    </g>
    <rect x="640" y="318" width="290" height="170" rx="14" fill="#18181b"/>
    <text x="660" y="358" font-size="26" font-weight="700" fill="#f4f4f5">ES module</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24">
      <text x="660" y="406" fill="#fbbf24">promise then</text>
      <text x="660" y="446" fill="#f4f4f5" font-weight="700">nextTick</text>
    </g>

    <!-- note -->
    <text x="30" y="540" font-size="27" fill="#3f3f46">A nextTick never cuts into a microtask drain that is running.</text>
    <text x="30" y="578" font-size="27" fill="#3f3f46">An ES module's top level runs inside one. (Node.js 24.22.3)</text>
  </g>
</svg>
