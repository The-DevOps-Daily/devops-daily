# Releases block: stable releases from GitHub release feeds, plus the
# official PostgreSQL release posts. Alphas, betas and RCs are skipped,
# except x.y.0 RCs where majorRc is set.
releases:
  - name: "Kubernetes"
    github: "kubernetes/kubernetes"
    majorRc: true
  - name: "PostgreSQL"
    feed: "https://www.postgresql.org/news.rss"
    majorRc: true
  - name: "Terraform"
    github: "hashicorp/terraform"
  - name: "OpenTofu"
    github: "opentofu/opentofu"
  - name: "Docker Compose"
    github: "docker/compose"
  - name: "Moby (Docker Engine)"
    github: "moby/moby"
  - name: "Helm"
    github: "helm/helm"
  - name: "Argo CD"
    github: "argoproj/argo-cd"
  - name: "Prometheus"
    github: "prometheus/prometheus"
    # v0.3xx tags are the Go module versions of the 3.x releases.
    skip: "^0\\."
  - name: "Grafana"
    github: "grafana/grafana"
  - name: "Istio"
    github: "istio/istio"
  - name: "Cilium"
    github: "cilium/cilium"
  - name: "containerd"
    github: "containerd/containerd"
