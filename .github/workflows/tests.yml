name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Keep the existing type backlog visible while it is paid down incrementally.
      - name: Report TypeScript baseline
        continue-on-error: true
        run: pnpm typecheck

      # Keep the existing lint backlog visible while it is paid down incrementally.
      - name: Report ESLint baseline
        continue-on-error: true
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Install browser for smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e
