name: Build Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.mjs', '**/*.cjs', '!**/node_modules/**', '!.next/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Validate game registry
        run: pnpm validate:games

      - name: Run build
        run: pnpm build:fast
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Cloudflare Pages refuses a deployment with more than 20,000 files.
      - name: Count deploy files
        run: |
          count=$(find out -type f | wc -l)
          echo "out/ has $count files (Cloudflare Pages limit: 20,000)"
          {
            echo "### Deploy size: $count of 20,000 files"
            echo '```'
            find out -type f | awk -F/ '{print $2}' | sort | uniq -c | sort -rn | head -12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -ge 20000 ]; then
            echo "::error title=Over the Cloudflare Pages file limit::out/ has $count files; Cloudflare Pages refuses more than 20,000."
            exit 1
          elif [ "$count" -ge 19000 ]; then
            echo "::warning title=Near the Cloudflare Pages file limit::out/ has $count files; Cloudflare Pages refuses more than 20,000."
          fi

      - name: Check for broken links
        run: pnpm check-links
